name: realtime-ci

on:
  push:
  pull_request:

jobs:
  realtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Protobuf Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Verify protoc
        run: protoc --version

      - run: npm ci

      # Enable this after Phase 3 creates the .proto files
      # - run: npm run generate --workspace packages/protocol

      - run: npm run lint --workspace apps/realtime-gateway
      - run: npm run typecheck --workspace apps/realtime-gateway
      - run: npm run test --workspace apps/realtime-gateway --if-present
      - run: npm run build --workspace apps/realtime-gateway

      - run: docker build -t squadpuzzle-realtime-gateway ./apps/realtime-gateway