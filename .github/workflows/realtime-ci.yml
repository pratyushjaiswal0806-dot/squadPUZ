name: realtime-ci

on:
  push:
  pull_request:

jobs:
  realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace apps/realtime-gateway
      - run: npm run typecheck --workspace apps/realtime-gateway
      - run: npm run build --workspace apps/realtime-gateway
      - run: docker build -t squadpuzzle-realtime-gateway ./apps/realtime-gateway